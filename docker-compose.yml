services:
  # TODO Add NGINX proxy
  sc2-stats-api:
    container_name: sc2-stats-api
    image: sc2-stats-backend:latest
    command: gunicorn -w 3 -t 60 -b 0.0.0.0:${SC2_STATS_API_PORT} backend.api.app:app
    ports:
      - ${SC2_STATS_API_PORT}:${SC2_STATS_API_PORT}
    volumes:
      - ${SC2_STATS_ENV_PATH}:/app/.env
      - ${SC2_STATS_LOG_PATH}:/app/log
    networks:
      - sc2-stats-network

  sc2-stats-db:
    container_name: sc2-stats-db
    restart: unless-stopped
    image: sc2-stats-db:latest
    command: >-
      -p ${SC2_STATS_PG_PORT}
    environment:
      POSTGRES_DB: ${SC2_STATS_PG_DB}
      POSTGRES_USER: ${SC2_STATS_PG_USER}
      POSTGRES_PASSWORD: ${SC2_STATS_PG_PASSWORD}
    volumes:
      - ${SC2_STATS_DB_PATH}:/var/lib/postgresql/data
    ports:
      - ${SC2_STATS_PG_PORT}:${SC2_STATS_PG_PORT}
    networks:
      - sc2-stats-network

  sc2-stats-etl:
    container_name: sc2-stats-etl
    image: sc2-stats-backend:latest
    volumes:
      - ${SC2_STATS_ENV_PATH}:/app/.env
      - ${SC2_STATS_LOG_PATH}/app/log
    networks:
      - sc2-stats-network

  sc2-stats-test:
    container_name: sc2-stats-test
    image: sc2-stats-test:latest
    volumes:
      - ${SC2_STATS_ENV_PATH}:/app/.env
      - ${SC2_STATS_LOG_PATH}:/app/log
    networks:
      - sc2-stats-network

networks:
  sc2-stats-network:
    name: sc2-stats-network
    external: true
