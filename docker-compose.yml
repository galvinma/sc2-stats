services:
  # TODO Add NGINX proxy
  sc2-stats-api:
    container_name: sc2-stats-api
    image: sc2-stats-backend:latest
    command: gunicorn -w 3 -t 60 -b 0.0.0.0:5399 backend.api.app:app
    ports:
      - "5399:5399"
    volumes:
      - .env:/app/.env
      - ./log:/app/log
      - ./backend:/app/backend
    networks:
      - sc2-stats-network

  sc2-stats-etl:
    container_name: sc2-stats-etl
    image: sc2-stats-backend:latest
    volumes:
      - .env:/app/.env
      - ./log:/app/log
      - ./backend:/app/backend
    networks:
      - sc2-stats-network

  sc2-stats-db:
    container_name: sc2-stats-db
    restart: unless-stopped
    image: sc2-stats-db:latest
    command: >-
      -p 6213
    environment:
      POSTGRES_DB: ${SC2_STATS_PG_DB}
      POSTGRES_USER: ${SC2_STATS_PG_USER}
      POSTGRES_PASSWORD: ${SC2_STATS_PG_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "6213:6213"
    networks:
      - sc2-stats-network

networks:
  sc2-stats-network:
    name: sc2-stats-network
    external: true
